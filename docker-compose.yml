version: '3.9'

services:

  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"

  backend:
    build: ./PartsService
    container_name: backend
    ports:
      - "8080:8080"
    depends_on:
      - mongo

  frontend:
    build: ./parts-app
    container_name: frontend
    ports:
      - "4200:80"
    depends_on:
      - backend