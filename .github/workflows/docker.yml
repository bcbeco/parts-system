name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Debug repo structure
      run: |
        ls -la
        ls -la PartsService
        ls -la parts-app


    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # BACKEND
    - name: Build backend image
      run: |
        docker build -t ghcr.io/${{ github.actor }}/parts-backend:latest ./PartsService

    - name: Push backend image
      run: |
        docker push ghcr.io/${{ github.actor }}/parts-backend:latest

    # FRONTEND
    - name: Build frontend image
      run: |
        docker build -t ghcr.io/${{ github.actor }}/parts-frontend:latest ./parts-app

    - name: Push frontend image
      run: |
        docker push ghcr.io/${{ github.actor }}/parts-frontend:latest
